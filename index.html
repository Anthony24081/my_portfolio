<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anthony Ogunsanwo | Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
        }
        .profile-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }
        h1 {
            font-size: 1.8rem;
            color: #38bdf8;
            margin-bottom: 6px;
        }
        .tagline {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 16px;
        }
        .details-list {
            list-style: none;
            border-top: 1px solid #334155;
            padding-top: 12px;
        }
        .details-list li {
            font-size: 0.9rem;
            color: #cbd5e1;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
        .details-list span {
            color: #38bdf8;
            font-weight: 600;
        }
        .dashboard-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }
        .dashboard-card h2 {
            font-size: 1.3rem;
            margin-bottom: 6px;
            color: #f8fafc;
        }
        .dashboard-card p.subtitle {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 16px;
        }
        button {
            width: 100%;
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0369a1;
        }
        #output {
            margin-top: 16px;
            background-color: #090d16;
            padding: 15px;
            border-radius: 6px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            color: #4ade80;
            border-left: 4px solid #38bdf8;
            min-height: 80px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Personal Details Header Card -->
    <div class="profile-card">
        <h1>Anthony Ogunsanwo</h1>
        <p class="tagline">Cybersecurity & Software Development</p>
        
        <ul class="details-list">
            <li><strong>Matric Number:</strong> <span>Cyb/2025/1095</span></li>
            <li><strong>Faculty:</strong> <span>Faculty of Computing</span></li>
            <li><strong>Course:</strong> <span>COS 201</span></li>
        </ul>
    </div>

    <!-- Live System Metrics Dashboard Card -->
    <div class="dashboard-card">
        <h2>System Dashboard</h2>
        <p class="subtitle">Full-Stack Render Backend Metrics</p>
        
        <button onclick="runAudit()">Run Security Audit</button>

        <div id="output">> Ready to execute server routine...</div>
    </div>
</div>

<script>
async function runAudit() {
    const outputDiv = document.getElementById('output');
    outputDiv.innerText = "> Connecting to server...";

    try {
        let response = await fetch('https://my-portfolio-backend-zg6v.onrender.com/run-script', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ input: "Full-Stack Security Audit" })
        });

        let data = await response.json();

        outputDiv.innerText = 
`> Status: ${data.status.toUpperCase()}
> Executed At: ${data.executed_at}
> Task: ${data.task}
> CPU Load: ${data.system_metrics.cpu_load}
> RAM Usage: ${data.system_metrics.memory_usage}
> Security: ${data.system_metrics.security_status}

[RESULT]: ${data.output}`;
    } catch (err) {
        outputDiv.innerText = "> Error: Could not connect to backend server.";
    }
}
</script>

</body>
</html>
