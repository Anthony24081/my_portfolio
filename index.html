<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Security Portfolio</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --green-color: #2ea043;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--accent-color);
            margin-top: 0;
        }

        .terminal {
            background-color: #000;
            border-radius: 6px;
            padding: 15px;
            font-family: monospace;
            color: #39ff14;
            min-height: 80px;
            border: 1px solid #30363d;
            white-space: pre-wrap;
        }

        button {
            background-color: var(--green-color);
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h1>Cyber Security & Dev Portfolio</h1>
            <p>Welcome! This site hosts my custom Python script execution environment directly from the web.</p>
        </div>

        <div class="card">
            <h2>Python Console Output</h2>
            <div id="output" class="terminal">> Waiting for script execution...</div>
            <button onclick="runPython()">Run Script</button>
        </div>
    </div>

    <script>
        async function runPython() {
            const outputDiv = document.getElementById('output');
            outputDiv.innerText = "> Connecting to Python backend...";
            
            try {

                 let response = await fetch('https://my-portfolio-backend-zg6v.onrender.com/run-script', { method: 'POST' });

                
                let data = await response.json();
                
                if (data.success) {
                    outputDiv.innerText = data.output;
                } else {
                    outputDiv.innerText = "> Error: " + data.output;
                }
            } catch (err) {
                outputDiv.innerText = "> Local backend server not running.\n> Note: Static GitHub Pages hosts HTML frontend. Connect local Flask server for live script processing.";
            }
        }
    </script>
</body>
</html>
