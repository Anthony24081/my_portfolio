<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anthony | Full-Stack Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 24px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: #38bdf8;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        button {
            width: 100%;
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0369a1;
        }
        #output {
            margin-top: 20px;
            background-color: #090d16;
            padding: 15px;
            border-radius: 6px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            color: #4ade80;
            border-left: 4px solid #38bdf8;
            min-height: 80px;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>System Dashboard</h1>
    <p class="subtitle">Full-Stack Endpoint Metrics</p>
    
    <button onclick="runAudit()">Run Security Audit</button>

    <div id="output">> Ready to execute server routine...</div>
</div>

<script>
async function runAudit() {
    const outputDiv = document.getElementById('output');
    outputDiv.innerText = "> Connecting to server...";

    try {
        let response = await fetch('https://my-portfolio-backend-zg6v.onrender.com/run-script', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ input: "Full-Stack Security Audit" })
        });

        let data = await response.json();

        outputDiv.innerText = 
`> Status: ${data.status.toUpperCase()}
> Executed At: ${data.executed_at}
> Task: ${data.task}
> CPU Load: ${data.system_metrics.cpu_load}
> RAM Usage: ${data.system_metrics.memory_usage}
> Security: ${data.system_metrics.security_status}

[RESULT]: ${data.output}`;
    } catch (err) {
        outputDiv.innerText = "> Error: Could not connect to backend server.";
    }
}
</script>

</body>
</html>
